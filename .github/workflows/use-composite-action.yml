name: Use Composite Action

on:
  workflow_dispatch:

jobs:
  use-action:
    runs-on: ubuntu-latest
    steps:
      - name: Run random number generator
        id: random-number
        uses: chendanou/composite-action@602ed672364bb134af804225219e8d0ac2a48abc
        with:
          user-name: Developer

      - name: Print generated number
        run: |
          echo "Generated number: ${{ steps.random-number.outputs.generated-number }}"