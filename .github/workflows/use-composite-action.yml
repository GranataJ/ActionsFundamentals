name: Use Composite Action

on:
  workflow_dispatch:

jobs:
  use-action:
    runs-on: ubuntu-latest
    steps:
      - name: Run random number generator
        id: random-number
        uses: GranataJ/JG-Action1@v1
        with:
          user-name: Developer

      - name: Print generated number
        run: |
          echo "Generated number: ${{ steps.random-number.outputs.generated-number }}"
